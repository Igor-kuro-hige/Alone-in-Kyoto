<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="services-page">
    <div id="header-placeholder"></div>
    <main>
      <h2>Services</h2>
      <form>
        <fieldset>
          <legend>What do you need?</legend>

          <label>
            <input type="radio" name="service-type" value="item" checked />
            Bring an item from Japan
          </label>

          <label>
            <input type="radio" name="service-type" value="guide" />
            Guide service
          </label>
        </fieldset>

        <label for="name">Your name</label>
        <input type="text" id="name" name="name" class="form-field" required />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-field"
          required
        />

        <label for="item">What do you dream about</label>
        <textarea
          id="item"
          name="item"
          class="form-field"
          rows="4"
          required
        ></textarea>

        <label for="duration">Tour duration (if guide)</label>
        <select id="duration" name="duration" class="form-field">
          <option value="">Choose duration</option>
          <option value="half-day">Half day (3-4 hours)</option>
          <option value="full-day">Full day (6-8 hours)</option>
        </select>

        <label for="budget">Budget (optional)</label>
        <input type="number" id="budget" name="budget" class="form-field" />

        <button type="submit">Submit</button>
      </form>
    </main>
    <div id="footer-placeholder"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
