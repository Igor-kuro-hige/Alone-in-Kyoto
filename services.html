<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="services-page">
    <header>
      <h1>Alone in Kyoto</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Blog</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <main>
      <h2>Bring something from Japan</h2>
      <form>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" class="form-field" required />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-field"
          required
        />

        <label for="item">What do you dream about</label>
        <textarea
          id="item"
          name="item"
          class="form-field"
          rows="4"
          required
        ></textarea>

        <label for="budget">Budget (optional)</label>
        <input type="number" id="budget" name="budget" class="form-field" />

        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <p>Alembekov Igor aka Alone in Kyoto</p>
    </footer>
  </body>
</html>
